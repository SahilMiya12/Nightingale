<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SENTINEL • Triage Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-deep: #06080d;
      --bg-primary: #0a0f1a;
      --bg-card: #131b2e;
      --text-primary: #e8edf5;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-subtle: rgba(148, 163, 184, 0.08);
      --sentinel-red: #ff6b6b;
      --sentinel-red-dark: #ee5a6f;
      --shadow-glow-red: 0 0 30px rgba(255, 107, 107, 0.15);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 24px;
    }

    .dashboard-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 28px;
      background: var(--bg-card);
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(255, 107, 107, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .header-title h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      font-weight: 700;
      color: var(--sentinel-red);
    }

    .header-title p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      font-size: 12px;
      color: #10b981;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: var(--sentinel-red);
      box-shadow: var(--shadow-glow-red);
    }

    .stat-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .stat-card.emergency .stat-number { color: #dc3545; }
    .stat-card.high .stat-number { color: #fd7e14; }
    .stat-card.routine .stat-number { color: #ffc107; }
    .stat-card.info .stat-number { color: #28a745; }

    /* Main Content */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 24px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title i {
      color: var(--sentinel-red);
    }

    /* Distribution */
    .distribution-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    .distribution-item:last-child {
      border-bottom: none;
    }

    .distribution-label {
      font-size: 14px;
      color: var(--text-secondary);
      min-width: 100px;
    }

    .distribution-bar {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      overflow: hidden;
    }

    .distribution-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 1s ease;
    }

    .distribution-count {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      min-width: 30px;
      text-align: right;
    }

    /* Recent Cases Table */
    .cases-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .cases-table th {
      text-align: left;
      padding: 10px 12px;
      color: var(--text-muted);
      font-weight: 500;
      border-bottom: 1px solid var(--border-subtle);
    }

    .cases-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }

    .cases-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .priority-badge {
      display: inline-block;
      padding: 2px 12px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
      color: white;
      text-transform: uppercase;
    }

    .priority-emergency { background: #dc3545; }
    .priority-high { background: #fd7e14; }
    .priority-routine { background: #ffc107; color: #000; }
    .priority-information { background: #28a745; }

    .symptom-text {
      color: var(--text-primary);
      font-weight: 500;
    }

    .department-text {
      font-size: 12px;
      color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.3;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      body { padding: 16px; }
      .header { padding: 16px 20px; flex-direction: column; align-items: flex-start; }
      .header-right { width: 100%; justify-content: flex-start; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .cases-table { font-size: 12px; }
      .cases-table th, .cases-table td { padding: 8px; }
    }

    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .stat-number { font-size: 24px; }
      .distribution-label { min-width: 70px; font-size: 12px; }
    }
  </style>
</head>
<body>
<div class="dashboard-container">
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="header-icon">🚦</div>
      <div class="header-title">
        <h1>SENTINEL</h1>
        <p>Smart Emergency Navigation & Triage Intelligence Engine</p>
      </div>
    </div>
    <div class="header-right">
      <div class="status-badge">
        <span class="status-dot"></span>
        <span id="statusText">Active</span>
      </div>
      <button onclick="refreshData()" style="
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid var(--border-subtle);
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 12px;
        font-family: 'Inter', sans-serif;
      ">
        <i class="fas fa-sync-alt"></i> Refresh
      </button>
    </div>
  </header>

  <!-- Stats -->
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card">
      <div class="stat-number" id="totalCases">0</div>
      <div class="stat-label">Total Cases</div>
    </div>
    <div class="stat-card emergency">
      <div class="stat-number" id="emergencyCases">0</div>
      <div class="stat-label">🚨 Emergency</div>
    </div>
    <div class="stat-card high">
      <div class="stat-number" id="highCases">0</div>
      <div class="stat-label">🔴 High Priority</div>
    </div>
    <div class="stat-card routine">
      <div class="stat-number" id="routineCases">0</div>
      <div class="stat-label">🟡 Routine</div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-grid">
    <!-- Distribution -->
    <div class="card">
      <div class="card-title"><i class="fas fa-chart-pie"></i> Triage Distribution</div>
      <div id="distributionContainer">
        <div class="empty-state">
          <i class="fas fa-chart-bar"></i>
          <p>No triage data available</p>
        </div>
      </div>
    </div>

    <!-- Recent Cases -->
    <div class="card">
      <div class="card-title"><i class="fas fa-clock"></i> Recent Cases</div>
      <div id="recentCasesContainer">
        <div class="empty-state">
          <i class="fas fa-inbox"></i>
          <p>No recent triage cases</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  async function fetchData() {
    try {
      const response = await fetch('/api/dashboard/sentinel');
      const data = await response.json();
      
      if (data.status === 'active') {
        document.getElementById('statusText').textContent = 'Active';
        updateStats(data);
        updateDistribution(data);
        updateRecentCases(data);
      } else {
        document.getElementById('statusText').textContent = '⚠️ Error';
      }
    } catch (error) {
      console.error('Error fetching data:', error);
      document.getElementById('statusText').textContent = '⚠️ Offline';
    }
  }

  function updateStats(data) {
    document.getElementById('totalCases').textContent = data.total_cases || 0;
    document.getElementById('emergencyCases').textContent = data.emergency_cases || 0;
    document.getElementById('highCases').textContent = data.high_priority || 0;
    document.getElementById('routineCases').textContent = data.routine_cases || 0;
  }

  function updateDistribution(data) {
    const container = document.getElementById('distributionContainer');
    const dist = data.severity_distribution || {};
    const colors = {
      Emergency: '#dc3545',
      High: '#fd7e14',
      Routine: '#ffc107',
      Information: '#28a745'
    };
    const total = data.total_cases || 1;

    let html = '';
    for (const [label, count] of Object.entries(dist)) {
      const percentage = total > 0 ? (count / total) * 100 : 0;
      html += `
        <div class="distribution-item">
          <span class="distribution-label">${label}</span>
          <div class="distribution-bar">
            <div class="distribution-fill" style="width: ${percentage}%; background: ${colors[label] || '#94a3b8'};"></div>
          </div>
          <span class="distribution-count">${count}</span>
        </div>
      `;
    }

    container.innerHTML = html || '<div class="empty-state"><i class="fas fa-chart-bar"></i><p>No triage data available</p></div>';
  }

  function updateRecentCases(data) {
    const container = document.getElementById('recentCasesContainer');
    const cases = data.recent_triages || [];

    if (cases.length === 0) {
      container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>No recent triage cases</p></div>';
      return;
    }

    let html = `
      <table class="cases-table">
        <thead>
          <tr>
            <th>Symptom</th>
            <th>Priority</th>
            <th>Department</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody>
    `;

    for (const triage of cases) {
      const priorityClass = triage.priority.toLowerCase();
      const time = triage.created_at ? new Date(triage.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '—';
      html += `
        <tr>
          <td><span class="symptom-text">${triage.symptom || 'Unknown'}</span></td>
          <td><span class="priority-badge priority-${priorityClass}">${triage.priority}</span></td>
          <td><span class="department-text">${triage.department || 'General Medicine'}</span></td>
          <td style="font-size: 12px; color: var(--text-muted);">${time}</td>
        </tr>
      `;
    }

    html += '</tbody></table>';
    container.innerHTML = html;
  }

  function refreshData() {
    fetchData();
  }

  // Auto-refresh every 10 seconds
  fetchData();
  setInterval(fetchData, 10000);
</script>
</body>
</html>
